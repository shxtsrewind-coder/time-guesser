<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary SEO -->
    <title>When & Where — Daily Historical Photo Guessing Game</title>
    <meta name="description" content="Guess the year, the place, and the day of the week from real archival photographs. A new free Daily Challenge every day, plus unlimited Decade Sort rounds." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://whenandwhere.bgameworld.com/" />
    <meta name="theme-color" content="#090d16" />
    <meta name="author" content="bgameworld.com" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, WhatsApp, ...) -->
    <meta property="og:site_name" content="When & Where" />
    <meta property="og:title" content="When & Where — Daily Historical Photo Guessing Game" />
    <meta property="og:description" content="Guess the year, the place, and the day of the week from real archival photographs. A new free Daily Challenge every day, plus unlimited Decade Sort rounds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whenandwhere.bgameworld.com/" />
    <meta property="og:image" content="https://whenandwhere.bgameworld.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="When & Where — pin the year, pin the place, prove it." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="When & Where — Daily Historical Photo Guessing Game" />
    <meta name="twitter:description" content="Guess the year, the place, and the day of the week from real archival photographs. A new free Daily Challenge every day." />
    <meta name="twitter:image" content="https://whenandwhere.bgameworld.com/og-image.png" />

    <!-- Icons & manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: lets Google show this as a game, not a generic page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "When & Where",
        "url": "https://whenandwhere.bgameworld.com/",
        "image": "https://whenandwhere.bgameworld.com/og-image.png",
        "description": "Guess the year, the place, and the day of the week from real archival photographs. A new free Daily Challenge every day, plus unlimited Decade Sort rounds.",
        "genre": ["Puzzle", "Trivia", "Geography", "History"],
        "applicationCategory": "Game",
        "operatingSystem": "Any (Web Browser)",
        "isAccessibleForFree": true,
        "publisher": {
          "@type": "Organization",
          "name": "bgameworld.com",
          "url": "https://bgameworld.com/"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Photos are served from Supabase Storage on every round; warm the connection early so the
         first image fetch skips DNS + TLS setup instead of paying for it on the critical path. -->
    <link rel="preconnect" href="https://pfxmswdwosimghjaggsk.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://pfxmswdwosimghjaggsk.supabase.co">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400..600&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Critical, inline boot styles. These paint immediately from the raw HTML —
      before the JS bundle downloads/parses, before Tailwind's generated CSS
      loads, before web fonts arrive — so the very first frame is the dark
      "When & Where" background and a loading mark instead of a flash of
      blank/white. #initial-loader is removed once React has mounted (see
      src/main.tsx); everything here is intentionally duplicated as plain CSS
      so it has zero dependency on anything else loading first.
    -->
    <style>
      html, body {
        background-color: #090d16;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #090d16;
        background-image: radial-gradient(circle at 50% 0%, #151d32 0%, #090d16 55%, #060911 100%);
        transition: opacity 0.25s ease;
      }
      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader .wwr-loader-mark {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #initial-loader .wwr-loader-mark .amber { color: #f5b23c; }
      #initial-loader .wwr-loader-mark .cyan { color: #38d9e8; }
      #initial-loader .wwr-loader-mark .amp {
        font-family: Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 18px;
        color: #5b6372;
        margin: 0 2px;
      }
      #initial-loader .wwr-loader-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(245, 178, 60, 0.25);
        border-top-color: #f5b23c;
        animation: wwr-spin 0.7s linear infinite;
      }
      #initial-loader .wwr-loader-caption {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6b7280;
      }
      @keyframes wwr-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .wwr-loader-spinner {
          animation-duration: 1.4s;
        }
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-cyan-900/60 selection:text-cyan-200">
    <div id="initial-loader" aria-live="polite" aria-label="Loading When &amp; Where">
      <div class="wwr-loader-mark">
        <span class="amber">WHEN</span>
        <span class="amp">&amp;</span>
        <span class="cyan">WHERE</span>
      </div>
      <div class="wwr-loader-spinner" role="status"></div>
      <div class="wwr-loader-caption">Opening the archive&hellip;</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
